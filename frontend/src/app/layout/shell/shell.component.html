<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="shell__sidenav">
    <div class="shell__logo">
      <mat-icon>account_balance</mat-icon>
      <span>ACME Comp Hub</span>
    </div>
    <mat-nav-list>
      @for (item of navItems; track item.route) {
        <a mat-list-item
           [routerLink]="item.route"
           routerLinkActive="active-link">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <!-- User info + logout at the bottom of sidenav -->
    <div class="shell__user">
      @if (authService.getCurrentUser(); as user) {
        <span class="shell__user-name">{{ user.fullName }}</span>
      }
      <button mat-icon-button
              matTooltip="Sign out"
              (click)="logout()"
              aria-label="Sign out"
              class="shell__logout-btn">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="shell__content">
    <mat-toolbar color="primary" class="shell__toolbar">
      <span>ACME Compensation Hub</span>
    </mat-toolbar>
    <main class="shell__main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
