server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Angular routing ────────────────────────────────────────────────────
    # All non-file requests fall back to index.html so Angular's client-side
    # router handles them. Without this, a hard refresh on /employees/123
    # returns a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy ──────────────────────────────────────────────────────────
    # Requests to /api/** are forwarded to the backend container.
    # This eliminates CORS issues — the browser only talks to one origin.
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — analytics queries can take up to 1 second
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;

    # ── Static asset caching ───────────────────────────────────────────────
    # Angular hashes filenames on build, so these assets are safe to cache
    # aggressively. index.html is never cached.
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
