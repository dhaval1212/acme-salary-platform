# ── Test profile ─────────────────────────────────────────────────────────────
# Used by @ActiveProfiles("test") in integration tests.
#
# DATASOURCE: placeholder values — @DynamicPropertySource in the test class
# overrides these with the real Testcontainers JDBC URL before the context
# starts.  Without a placeholder, Spring Boot fails at property binding before
# @DynamicPropertySource has a chance to fire.
spring.datasource.url=jdbc:postgresql://localhost:5432/test_placeholder
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
# Let Liquibase own the schema; Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ── Liquibase ─────────────────────────────────────────────────────────────────
# Run schema + user seed changesets. Contexts: test runs 0001-0003, 0005, 0006.
# Employee seed data (0004) is tagged 'local' and skipped in tests.
spring.liquibase.contexts=test

# ── JWT — test environment ────────────────────────────────────────────────────
# Safe to commit — only used in isolated Testcontainers test environment.
jwt.secret=test-secret-for-integration-tests-minimum-32-chars
jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:4200
