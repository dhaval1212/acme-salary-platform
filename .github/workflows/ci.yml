name: CI

# ── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

# Cancel in-progress runs for the same branch on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

# ── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Unit tests + coverage check ────────────────────────────────────────
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar needs full history for blame annotations
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit tests (exclude integration tests that need Docker)
        run: ./mvnw verify -DexcludedGroups=integration --batch-mode --no-transfer-progress

      - name: Upload JaCoCo XML report (for Sonar)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/jacoco.xml
          retention-days: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/
          retention-days: 7

  # ── 2. Integration test (needs Docker / Testcontainers) ───────────────────
  integration-test:
    name: Integration Test (Testcontainers)
    runs-on: ubuntu-latest
    # Only run on pushes to main/develop, not on every PR to keep it fast
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests (Docker available on GitHub runners)
        run: ./mvnw test -Dgroups=integration --batch-mode --no-transfer-progress

  # ── 3. Static analysis (SonarCloud) ───────────────────────────────────────
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    # Skip Sonar on forks (they don't have access to secrets)
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar \
            --batch-mode \
            --no-transfer-progress \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

  # ── 4. Build JAR ──────────────────────────────────────────────────────────
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: [ test, sonar ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build production JAR (skip tests — already ran)
        run: ./mvnw package -DskipTests --batch-mode --no-transfer-progress

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: compensation-jar
          path: backend/target/compensation-*.jar
          # Exclude the plain JAR (keep only the Spring Boot fat JAR)
          if-no-files-found: error
          retention-days: 7
